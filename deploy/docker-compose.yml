services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: remoto
      MYSQL_USER: remoto
      MYSQL_PASSWORD: remoto
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REMOTO_CONFIG: /app/configs/config.mysql.yaml
    volumes:
      - ../server/configs:/app/configs
    depends_on:
      - mysql

volumes:
  mysql_data:
